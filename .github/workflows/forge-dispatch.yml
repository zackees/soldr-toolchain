name: forge dispatch

# soldr-toolchain#14 Phase 3: one-button forge dispatch + ingest.
# Fires `forge-ci/forge`'s forge-conan.yml for the requested
# (tool, version, shape) tuple, then triggers forge-ingest.yml once
# the forge run finishes.
#
# Use `shape: all` to fire every supported shape for the selected tool.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool name"
        required: true
        type: choice
        default: apple-sdk
        options:
          - apple-sdk
          - zstd
          - sqlite
          - jemalloc
          - mimalloc
          - zlib-ng
          - lzma
          - bzip2
          - openssl
          - libuuid
          - llvm-host-libs
          - swift
          - compiler-rt
          - llvm-tools
          - cmake
          - ninja
          - uv
          - mingw-w64-gcc
          - gnu-linux-toolchain
          - musl-linux-toolchain
          - cargo-chef
          - crgx
      version:
        description: "SDK / tool/library version (e.g. 14.5, 1.5.7)"
        required: true
        type: string
      recipe_ref:
        description: "soldr-toolchain git ref containing the recipe"
        required: true
        type: string
        default: main
      shape:
        description: "Artifact shape, or 'all' for every supported shape"
        required: true
        type: choice
        default: universal2
        options:
          - universal2
          - thin-x86_64
          - thin-aarch64
          - windows-x64
          - windows-arm64
          - darwin-x64
          - darwin-arm64
          - linux-x64-gnu
          - linux-arm64-gnu
          - linux-x64-musl
          - linux-arm64-musl
          - windows-x64-gnu
          - all

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write     # needed to trigger forge-ingest.yml after the run

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Plan producer matrix
        id: plan
        env:
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
          SHAPE: ${{ inputs.shape }}
        run: |
          python - <<'PYTHON'
          import os
          import json
          from scripts.plan_forge_dispatch import build_matrix
          matrix = build_matrix(os.environ["TOOL"], os.environ["VERSION"], os.environ["SHAPE"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
          PYTHON

  forge:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    uses: forge-ci/forge/.github/workflows/forge-conan.yml@c4ed94c8973148adb9696231cc93aa7fa241a1f2
    with:
      recipe_repo: zackees/soldr-toolchain
      recipe_ref: ${{ inputs.recipe_ref }}
      recipe_path: ${{ matrix.recipe_path }}
      name: ${{ matrix.name }}
      version: ${{ inputs.version }}
      recipe_selection: ${{ matrix.recipe_selection }}
      macos_arm64_runner: ${{ matrix.macos_arm64_runner }}
      windows_x64: ${{ matrix.windows_x64 }}
      windows_x64_gnu: ${{ matrix.windows_x64_gnu }}
      windows_arm64: ${{ matrix.windows_arm64 }}
      linux_x64: ${{ matrix.linux_x64 }}
      linux_arm64: ${{ matrix.linux_arm64 }}
      linux_x64_musl: ${{ matrix.linux_x64_musl }}
      linux_arm64_musl: ${{ matrix.linux_arm64_musl }}
      macos_x64: ${{ matrix.macos_x64 }}
      macos_arm64: ${{ matrix.macos_arm64 }}

  ingest:
    needs: [plan, forge]
    runs-on: ubuntu-24.04
    strategy:
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Queue ingest of this run's Forge artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SHAPE: ${{ matrix.shape }}
          TOOL: ${{ inputs.tool }}
          VERSION: ${{ inputs.version }}
          RECIPE_REF: ${{ inputs.recipe_ref }}
        run: |
          gh workflow run forge-ingest.yml --repo "${{ github.repository }}" \
            --ref "$RECIPE_REF" \
            -f "forge_repository=${{ github.repository }}" \
            -f "forge_run_id=${{ github.run_id }}" \
            -f "tool=$TOOL" -f "version=$VERSION" -f "shape=$SHAPE"
