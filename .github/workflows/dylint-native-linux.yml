name: build Dylint native Linux artifacts

on:
  workflow_dispatch:
    inputs:
      dylint_ref:
        description: Immutable Dylint commit
        required: true
        default: 9adfa398661273ca7dc99df9bf2c26ae6f61b1c5
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            shape: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            shape: linux-arm64-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            shape: linux-x64-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            shape: linux-arm64-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: trailofbits/dylint
          ref: ${{ inputs.dylint_ref }}
          path: dylint
      - name: Verify immutable source
        working-directory: dylint
        run: |
          test "$(git rev-parse HEAD)" = "${{ inputs.dylint_ref }}"
          test -z "$(git status --porcelain)"
      - name: Install native musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build locked Dylint pair
        working-directory: dylint
        run: |
          rustup target add '${{ matrix.target }}'
          cargo build --locked --release --target '${{ matrix.target }}' \
            -p cargo-dylint -p dylint-link \
            --features=dylint/__driver_from_crates_io
          mkdir -p '../out/${{ matrix.shape }}'
          cp 'target/${{ matrix.target }}/release/cargo-dylint' '../out/${{ matrix.shape }}/'
          cp 'target/${{ matrix.target }}/release/dylint-link' '../out/${{ matrix.shape }}/'
      - uses: actions/upload-artifact@v4
        with:
          name: dylint-6.0.3-${{ matrix.shape }}
          path: out/${{ matrix.shape }}
          if-no-files-found: error
