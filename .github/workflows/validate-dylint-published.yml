name: validate published Dylint assets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_BASE: https://media.githubusercontent.com/media/zackees/soldr-toolchain/assets
  CATALOGUE_URL: https://raw.githubusercontent.com/zackees/soldr-toolchain/assets/catalogue.v1.json
  DYLINT_REF: 9adfa398661273ca7dc99df9bf2c26ae6f61b1c5
  DYLINT_REPOSITORY: https://github.com/trailofbits/dylint
  DYLINT_VERSION: 6.0.3

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x86_64-msvc
            target: x86_64-pc-windows-msvc
            suffix: .exe
            python: python
            runtime_smoke: true
            toolchain: stable-x86_64-pc-windows-msvc
          - runner: windows-2022
            platform: windows-aarch64-msvc
            target: aarch64-pc-windows-msvc
            suffix: .exe
            python: python
            runtime_smoke: false
            toolchain: stable-aarch64-pc-windows-msvc
          - runner: macos-14
            platform: darwin-x86_64
            target: x86_64-apple-darwin
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
          - runner: macos-14
            platform: darwin-aarch64
            target: aarch64-apple-darwin
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
          - runner: ubuntu-22.04
            platform: linux-x86_64-glibc
            target: x86_64-unknown-linux-gnu
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64-glibc
            target: aarch64-unknown-linux-gnu
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
          - runner: ubuntu-22.04
            platform: linux-x86_64-musl
            target: x86_64-unknown-linux-musl
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64-musl
            target: aarch64-unknown-linux-musl
            suffix: ''
            python: python3
            runtime_smoke: true
            toolchain: stable
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Fetch the published catalogue
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output catalogue.v1.json "$CATALOGUE_URL"

      - name: Fetch, verify, and relocate both published bundles
        shell: bash
        run: |
          set -euo pipefail
          for tool in cargo-dylint dylint-link; do
            name="$tool-$DYLINT_VERSION-${{ matrix.target }}.tar.gz"
            url="$ASSET_BASE/$tool/v$DYLINT_VERSION/${{ matrix.platform }}/$name"
            curl --fail --location --retry 3 --output "$name" "$url"
            tar -xzf "$name"
            test -x "package/$tool${{ matrix.suffix }}"
            mv package "relocated-$tool"
            mv manifest.json "relocated-$tool.manifest.json"
            "${{ matrix.python }}" - "$name" "$tool" "${{ matrix.suffix }}" "relocated-$tool.manifest.json" catalogue.v1.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          tool = sys.argv[2]
          suffix = sys.argv[3]
          manifest_path = Path(sys.argv[4])
          catalogue_path = Path(sys.argv[5])
          catalogue = json.loads(catalogue_path.read_text(encoding="utf-8"))
          entry = next((entry for entry in catalogue["entries"] if entry["asset"] == archive.name), None)
          if entry is None:
              raise SystemExit(f"missing catalogue entry for {archive.name}")
          archive_digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          if archive_digest != entry["sha256"]:
              raise SystemExit(f"archive SHA-256 mismatch for {archive.name}")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          payload = Path(f"relocated-{tool}") / f"{tool}{suffix}"
          payload_digest = hashlib.sha256(payload.read_bytes()).hexdigest()
          if payload_digest != manifest["payload_sha256"]:
              raise SystemExit(f"payload SHA-256 mismatch for {payload.name}")
          print(f"verified {archive.name}: archive and payload SHA-256")
          PY
            rm -f "$name"
          done

      - name: Verify non-runnable Windows ARM64 bundle layout
        if: matrix.runtime_smoke == false
        shell: bash
        run: |
          set -euo pipefail
          file "relocated-cargo-dylint/cargo-dylint${{ matrix.suffix }}" | grep -Eiq 'arm64|aarch64'
          file "relocated-dylint-link/dylint-link${{ matrix.suffix }}" | grep -Eiq 'arm64|aarch64'

      - name: Verify Linux ABI compatibility
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          binary='relocated-cargo-dylint/cargo-dylint'
          if [[ '${{ matrix.platform }}' == *musl ]]; then
            ! readelf -l "$binary" | grep -q 'INTERP'
          else
            max_glibc="$(readelf -V "$binary" | grep -o 'GLIBC_[0-9.]*' | LC_ALL=C sort -Vu | tail -1)"
            test -n "$max_glibc"
            printf 'cargo-dylint maximum GLIBC requirement: %s (allowed: <= GLIBC_2.17)\n' "$max_glibc"
            "${{ matrix.python }}" - "$max_glibc" GLIBC_2.17 <<'PY'
          import sys

          def parts(version: str) -> tuple[int, ...]:
              return tuple(int(part) for part in version.removeprefix("GLIBC_").split("."))

          if parts(sys.argv[1]) > parts(sys.argv[2]):
              raise SystemExit(f"{sys.argv[1]} exceeds {sys.argv[2]}")
          PY
          fi

      - name: Run a real Dylint fixture through the published pair
        if: matrix.runtime_smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fixture/src
          cat > fixture/Cargo.toml <<'EOF'
          [package]
          name = "published-dylint-fixture"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          anyhow = "1"
          EOF
          cat > fixture/src/lib.rs <<'EOF'
          use std::fs::File;

          pub fn loses_io_context() -> anyhow::Result<()> {
              let _ = File::open("missing")?;
              Ok(())
          }
          EOF
          export PATH="$PWD/relocated-cargo-dylint:$PWD/relocated-dylint-link:$PATH"
          export RUSTUP_TOOLCHAIN='${{ matrix.toolchain }}'
          pushd fixture
          cargo dylint --git "$DYLINT_REPOSITORY" --rev "$DYLINT_REF" --pattern examples/restriction/try_io_result 2>&1 | tee dylint.log
          grep -F 'try_io_result' dylint.log
          popd
