name: validate published Dylint assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: matrix
        run: echo "matrix=$(python3 -m scripts.validate_dylint_published plan --github-matrix)" >> "$GITHUB_OUTPUT"

  validate:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate native Windows or macOS publication
        if: matrix.environment == 'native'
        shell: bash
        run: >-
          python -m scripts.validate_dylint_published validate
          --repo-root . --work-dir '${{ runner.temp }}/dylint-published'
          --shape '${{ matrix.shape }}'
      - name: Validate native Linux ABI publication
        if: matrix.environment != 'native'
        run: >-
          python -m scripts.run_dylint_published_container
          --repo-root . --work-dir '${{ runner.temp }}/dylint-published'
          --shape '${{ matrix.shape }}'
