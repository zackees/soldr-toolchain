name: build and validate native Dylint release

on:
  workflow_dispatch:
    inputs:
      dylint_ref:
        description: Immutable Dylint commit
        required: true
        default: 9adfa398661273ca7dc99df9bf2c26ae6f61b1c5
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - id: matrix
        run: echo "matrix=$(python3 -m scripts.produce_dylint_release plan --github-matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: trailofbits/dylint
          ref: ${{ inputs.dylint_ref }}
          path: dylint
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and fixture-validate native Windows or macOS lane
        if: matrix.environment == 'native'
        shell: bash
        run: >-
          python -m scripts.produce_dylint_release build
          --repo-root . --dylint-checkout dylint --output-dir out
          --work-dir '${{ runner.temp }}/dylint-release' --shape '${{ matrix.shape }}'
      - name: Build and fixture-validate native Linux ABI lane
        if: matrix.environment != 'native'
        run: >-
          python -m scripts.run_dylint_release_container
          --repo-root . --shape '${{ matrix.shape }}'
      - uses: actions/upload-artifact@v4
        with:
          name: dylint-release-${{ matrix.shape }}
          path: out/forge-rust-*
          if-no-files-found: error
          retention-days: 7
